<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Open source, saved for later</p>
        <h1>Stargazers log</h1>
        <p class="intro">A running list of repositories worth keeping close.</p>
      </header>
      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="repository-count" aria-live="polite"></span>
        </div>
        <ul id="repository-list" class="repository-list" aria-live="polite">
          <li class="status-message">Loading repositories...</li>
        </ul>
      </section>
    </main>
  </body>
</html>
